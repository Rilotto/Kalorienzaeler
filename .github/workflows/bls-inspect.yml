name: BLS untersuchen
# Einmaliges Hilfswerkzeug: lädt das BLS-ZIP und hängt dessen Aufbau als Commit-Kommentar an.
on:
  push:
    branches: ["tools-bls-inspect"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install openpyxl
      - name: Laden und untersuchen
        run: |
          set -x
          curl -sSL -A "Mozilla/5.0 Kalorienzaehler-Build" -o bls.zip "https://blsdb.de/assets/uploads/BLS_4_0_2025_DE.zip?token=1XFC-4GP1-EVYQ-SONN-9HRU-3VUB-9GFV-84PA" || true
          ls -la bls.zip; file bls.zip || true
          { echo '```'; python tools/bls/bls_inspect.py bls.zip 2>&1 | head -c 60000; echo '```'; } > comment.md || { echo '```'; head -c 2000 bls.zip; echo '```'; } > comment.md
      - name: Kommentar
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s comment.md ] || echo "kein Ergebnis" > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md
