name: Release

# Veröffentlicht eine signierte APK als GitHub-Release.
# Auslöser: Push eines Zweigs `release/vX.Y.Z` (so arbeitet Claude, da Tag-Pushes über den Proxy gesperrt sind)
# oder eines Tags `vX.Y.Z`. Der Workflow legt Tag und Release selbst an.
# Versionen mit Bindestrich (z. B. v0.1.0-rc.1) werden als Vorabversion markiert.
on:
  push:
    branches: ["release/v*"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signatur prüfen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret KEYSTORE_PASSWORD fehlt. Ohne festen Schlüssel kein Release (Updates würden sonst nicht installierbar)." | tee build.log
            exit 1
          fi

      - name: Version bestimmen
        run: |
          TAG="${GITHUB_REF_NAME#release/}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Signierte APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest assembleRelease \
            -PversionName="${TAG#v}" -PversionCode="${{ github.run_number }}" 2>&1 | tee -a build.log
          cp app/build/outputs/apk/release/app-release.apk "kalorienzaehler-${TAG}.apk"

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${TAG#v}"
          # Abschnitt dieser Version aus CHANGELOG.md als Release-Text
          awk -v v="$VER" '
            $0 ~ "^## \\[?" v "\\]?" {p=1; next}
            p && /^## / {exit}
            p {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Siehe CHANGELOG.md" > notes.md
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease";; esac
          gh release create "$TAG" "kalorienzaehler-${TAG}.apk" --title "Kalorienzähler ${TAG}" --notes-file notes.md --target "$GITHUB_SHA" $PRE

      - name: Fehlerauszug an den Commit hängen
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Release ${TAG:-$GITHUB_REF_NAME} fehlgeschlagen"
            echo '```'
            grep -n -E "::error::|^e: |error:|What went wrong|FAILURE:|> Task .* FAILED" build.log | head -60 || true
            echo "----- Ende des Logs -----"
            tail -n 40 build.log || true
            echo '```'
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md
