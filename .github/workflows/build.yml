name: Build

# Baut bei jedem Push die App, führt die Tests aus und stellt die APK als Artefakt bereit.
# Schlägt der Build fehl, wird ein Auszug des Logs als Kommentar an den Commit gehängt
# (so kann Claude Fehler auch ohne Zugriff auf die Actions-API lesen).
on:
  push:
    branches: ["**", "!release/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Tests und Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest assembleRelease \
            -PversionName="0.0.0-build.${{ github.run_number }}" 2>&1 | tee build.log

      - name: Datenbank-Schema einchecken
        # Room schreibt bei jedem Build das Schema nach app/schemas. Neue/geänderte Dateien werden
        # automatisch auf den Zweig committet (Grundlage für spätere Migrationen).
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/schemas
            git commit -m "Datenbank-Schema aktualisieren (automatisch)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: kalorienzaehler-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Fehlerauszug an den Commit hängen
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Build fehlgeschlagen (Run ${{ github.run_number }})"
            echo '```'
            grep -n -E "^e: |error:|What went wrong|FAILURE:|Caused by|> Task .* FAILED|AAPT|Unresolved|Could not" build.log | head -80 || true
            echo "----- Ende des Logs -----"
            tail -n 60 build.log || true
            echo '```'
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md
